<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainrot Trade</title>
<style>
body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:#121725;padding:14px;display:flex;justify-content:space-between;z-index:5;border-bottom:1px solid #30384e}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#a43cff;color:#fff}
.gold{background:#d6a229;color:#111}.red{background:#702333}.dark{background:#293145}
main{max-width:850px;margin:auto;padding:15px}
input,textarea{width:100%;box-sizing:border-box;background:#111623;color:#fff;border:1px solid #38425a;border-radius:10px;padding:12px;margin:6px 0 10px}
.card{background:#141a28;border:1px solid #30394f;border-radius:16px;padding:14px;margin:13px 0}
.photo{height:180px;background:#20283b;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:50px}
.photo img{width:100%;height:100%;object-fit:cover}
.cert{color:#ffd348;font-weight:bold}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#111725;padding:9px;display:flex;justify-content:center;gap:8px;z-index:6}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}
.box{background:#151b2a;border-radius:18px;padding:17px;width:min(650px,100%);max-height:90vh;overflow:auto}
.messages{height:45vh;overflow:auto;background:#0b0f18;padding:10px;border-radius:12px}
.msg{background:#252d42;padding:9px;border-radius:12px;margin:7px 0;max-width:80%}
.mine{margin-left:auto;background:#66339b}
.star{font-size:32px;color:#555;cursor:pointer}
.star.on{color:#ffd000}
.report{border-left:4px solid #ff405f;padding-left:10px}
</style>
</head>

<body>

<header>
<strong>🧠 Brainrot Trade</strong>
<button class="gold" onclick="adminLogin()">🛡️ Admin</button>
</header>

<main>
<input id="search" placeholder="🔎 Rechercher..." oninput="renderAds()">
<button onclick="openCreate()">＋ Publier une annonce</button>
<div id="ads"></div>
</main>

<nav>
<button class="dark" onclick="renderAds()">🏠 Accueil</button>
<button onclick="openCreate()">＋ Annonce</button>
<button class="dark" onclick="openChats()">💬 Messages</button>
</nav>

<div id="create" class="modal">
<div class="box">
<h2>➕ Publier</h2>

<input id="owner" placeholder="Ton pseudo">
<input id="title" placeholder="Nom du Brainrot">
<textarea id="description" placeholder="Description"></textarea>
<input id="wanted" placeholder="Ce que tu recherches">
<input id="photo" type="file" accept="image/*">

<div class="actions">
<button onclick="createAd()">Publier</button>
<button class="dark" onclick="closeM('create')">Annuler</button>
</div>

</div>
</div>

<div id="chat" class="modal">
<div class="box">

<h2>💬 Chat</h2>
<p id="chatInfo"></p>

<div id="messages" class="messages"></div>

<input id="message" placeholder="Écrire un message...">

<div class="actions">
<button onclick="sendMessage()">Envoyer</button>
<button class="gold" onclick="closeChat()">🔒 Clôturer</button>
<button class="red" onclick="reportChat()">🚨 Signaler</button>
<button class="dark" onclick="closeM('chat')">Fermer</button>
</div>

</div>
</div>

<div id="rating" class="modal">
<div class="box">

<h2>⭐ Noter</h2>

<div id="stars"></div>

<textarea id="comment" placeholder="Commentaire facultatif"></textarea>

<button onclick="submitRating()">Valider</button>

</div>
</div>

<div id="chats" class="modal">
<div class="box">

<h2>💬 Mes conversations</h2>

<div id="chatList"></div>

<button class="dark" onclick="closeM('chats')">Fermer</button>

</div>
</div>

<div id="admin" class="modal">
<div class="box">

<h2>🛡️ Administration</h2>

<div class="actions">
<button onclick="adminAds()">📢 Annonces</button>
<button class="red" onclick="adminReports()">🚨 Signalements</button>
</div>

<div id="adminContent"></div>

<button class="dark" onclick="closeM('admin')">Fermer</button>

</div>
</div>

<script>

let me=localStorage.getItem("bt_user")||"";
let currentChat=null;
let currentRating=0;
let adminCode=null;

const $=id=>document.getElementById(id);

function esc(x){
return String(x??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function openM(id){
$(id).classList.add("show");
}

function closeM(id){
$(id).classList.remove("show");
}

async function api(url,opt={}){
let r=await fetch(url,{
headers:{"Content-Type":"application/json"},
...opt
});

let d=await r.json().catch(()=>({}));

if(!r.ok) throw Error(d.error||"Erreur serveur");

return d;
}

function askMe(){

if(!me){

me=prompt("Ton pseudo :")||"Joueur";

localStorage.setItem("bt_user",me);

}

return me;
}

async function renderAds(){

try{

let ads=await api("/api/ads");

let q=$("search").value.toLowerCase();

ads=ads.filter(a=>
(a.title+" "+a.description+" "+a.wanted+" "+a.owner)
.toLowerCase()
.includes(q)
);

$("ads").innerHTML=ads.length?

ads.map(a=>`

<div class="card">

<div class="photo">
${a.photo?`<img src="${a.photo}">`:"🧠"}
</div>

<h2>${esc(a.title)}</h2>

<p>👤 ${esc(a.owner)}</p>

<p>${esc(a.description)}</p>

<p>
🔄 Recherche :
<b>${esc(a.wanted)}</b>
</p>

${a.certified?
'<p class="cert">☑️ Utilisateur certifié</p>'
:""}

<div class="actions">

<button onclick="startChat(${a.id})">
💬 Chat
</button>

<button class="red" onclick="reportAd(${a.id})">
🚨 Signaler
</button>

</div>

</div>

`).join("")

:
"<div class='card'>Aucune annonce.</div>";

}catch(e){

$("ads").innerHTML=
"<div class='card'>Erreur serveur : "+
esc(e.message)+
"</div>";

}

}

function openCreate(){

askMe();

$("owner").value=me;

openM("create");

}

async function createAd(){

try{

askMe();

let file=$("photo").files[0];

let photo=null;

if(file){

photo=await new Promise((ok,no)=>{

let r=new FileReader();

r.onload=()=>ok(r.result);

r.onerror=no;

r.readAsDataURL(file);

});

}

await api("/api/ads",{

method:"POST",

body:JSON.stringify({

owner:$("owner").value.trim(),

title:$("title").value.trim(),

description:$("description").value.trim(),

wanted:$("wanted").value.trim(),

photo

})

});

closeM("create");

$("title").value="";
$("description").value="";
$("wanted").value="";
$("photo").value="";

await renderAds();

alert("Annonce publiée ✅");

}catch(e){

alert(e.message);

}

}

async function startChat(adId){

try{

askMe();

currentChat=await api("/api/chats",{

method:"POST",

body:JSON.stringify({

adId,

buyer:me

})

});

openM("chat");

renderChat();

}catch(e){

alert(e.message);

}

}

async function renderChat(){

try{

currentChat=
await api("/api/chats/"+currentChat.id);

let ads=await api("/api/ads");

let a=ads.find(x=>x.id===currentChat.adId);

$("chatInfo").textContent=
(a?.title||"Annonce")+
" — "+
(currentChat.status==="open"
?"🟢 ouvert"
:"🔒 clôturé");

$("message").disabled=
currentChat.status!=="open";

$("messages").innerHTML=
currentChat.messages.map(m=>`

<div class="msg ${m.user===me?"mine":""}">

<b>${esc(m.user)}</b>

<br>

${esc(m.text)}

</div>

`).join("");

$("messages").scrollTop=999999;

}catch(e){

alert(e.message);

}

}

async function sendMessage(){

try{

let t=$("message").value.trim();

if(!t)return;

await api(
"/api/chats/"+currentChat.id+"/messages",
{
method:"POST",
body:JSON.stringify({
user:me,
text:t
})
}
);

$("message").value="";

await renderChat();

}catch(e){

alert(e.message);

}

}

$("message").addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

}
);

async function closeChat(){

try{

await api(
"/api/chats/"+currentChat.id+"/close",
{
method:"POST",
body:"{}"
}
);

closeM("chat");

currentRating=0;

renderStars();

openM("rating");

}catch(e){

alert(e.message);

}

}

function renderStars(){

$("stars").innerHTML=

[1,2,3,4,5].map(n=>`

<span
class="star ${n<=currentRating?"on":""}"
onclick="currentRating=${n};renderStars()">

★
</span>

`).join("");

}

async function submitRating(){

if(!currentRating)
return alert("Choisis une note.");

try{

await api(
"/api/chats/"+currentChat.id+"/rating",
{
method:"POST",
body:JSON.stringify({

rating:currentRating,

comment:$("comment").value

})
}
);

$("comment").value="";

closeM("rating");

alert("Note enregistrée ⭐");

}catch(e){

alert(e.message);

}

}

async function reportAd(id){

let reason=
prompt("Motif du signalement :");

if(!reason)return;

try{

await api(
"/api/reports",
{
method:"POST",
body:JSON.stringify({

type:"Annonce",

target:id,

reporter:me,

reason

})
}
);

alert("Signalement envoyé 🚨");

}catch(e){

alert(e.message);

}

}

async function reportChat(){

let reason=
prompt("Motif du signalement :");

if(!reason)return;

try{

await api(
"/api/reports",
{
method:"POST",
body:JSON.stringify({

type:"Chat",

target:currentChat.id,

reporter:me,

reason

})
}
);

alert("Signalement envoyé 🚨");

}catch(e){

alert(e.message);

}

}

async function openChats(){

try{

let cs=
await api(
"/api/chats?user="+
encodeURIComponent(askMe())
);

$("chatList").innerHTML=

cs.length?

cs.map(c=>`

<div class="card">

<b>Conversation #${c.id}</b>

<p>
${c.status==="open"
?"🟢 Ouverte"
:"🔒 Clôturée"}
—
${c.messages.length}
message(s)
</p>

<button
onclick="
currentChat={id:${c.id}};
closeM('chats');
openM('chat');
renderChat();
">

Ouvrir

</button>

</div>

`).join("")

:

"Aucune conversation.";

openM("chats");

}catch(e){

alert(e.message);

}

}

async function adminLogin(){

let code=
prompt("Code admin :");

if(!code)return;

try{

let x=
await api(
"/api/admin/login",
{
method:"POST",
body:JSON.stringify({code})
}
);

if(!x.ok)
return alert("❌ Code incorrect.");

adminCode=code;

openM("admin");

adminAds();

}catch(e){

alert(e.message);

}

}

async function adminAds(){

try{

let ads=await api("/api/ads");

$("adminContent").innerHTML=

ads.length?

ads.map(a=>`

<div class="card">

<h3>${esc(a.title)}</h3>

<p>
👤 ${esc(a.owner)}

${a.certified?
'<span class="cert">☑️ Certifié</span>'
:""}

</p>

<div class="actions">

${
a.certified
?
'<button class="dark" disabled>☑️ Certifiée</button>'
:
`
<button
class="gold"
onclick="certify(${a.id})">
☑️ Certifier
</button>
`
}

<button
class="red"
onclick="removeAd(${a.id})">

🗑️ Supprimer

</button>

</div>

</div>

`).join("")

:

"Aucune annonce.";

}catch(e){

alert(e.message);

}

}

async function certify(id){

try{

await api(
"/api/admin/ads/"+id+"/certify",
{
method:"POST",

body:JSON.stringify({
code:adminCode
})
}
);

adminAds();

renderAds();

}catch(e){

alert(e.message);

}

}

async function removeAd(id){

if(!confirm("Supprimer cette annonce ?"))
return;

try{

await api(
"/api/admin/ads/"+id,
{
method:"DELETE",

body:JSON.stringify({
code:adminCode
})
}
);

adminAds();

renderAds();

}catch(e){

alert(e.message);

}

}

async function adminReports(){

try{

let rs=
await api(
"/api/admin/reports?code="+
encodeURIComponent(adminCode)
);

$("adminContent").innerHTML=

rs.length?

rs.map(r=>`

<div class="card report">

<b>🚨 ${esc(r.type)}</b>

<p>
${esc(r.reason)}
</p>

<small>
Par ${esc(r.reporter)}
</small>

</div>

`).join("")

:

"Aucun signalement.";

}catch(e){

alert(e.message);

}

}

renderStars();

renderAds();

setInterval(()=>{

if(
currentChat &&
$("chat").classList.contains("show")
){

renderChat();

}

},2000);

</script>

</body>
</html>
