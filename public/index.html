<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainrot Trade</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#123d4a 0,transparent 28%),radial-gradient(circle at 90% 20%,#431548 0,transparent 28%),#080b13;color:#fff;font-family:Arial,sans-serif}header{padding:16px;display:flex;justify-content:space-between;align-items:center;background:#101322ee;position:sticky;top:0;z-index:5;border-bottom:1px solid #333}.logo{font-weight:900;font-size:23px}.logo span{background:linear-gradient(90deg,#4dff88,#35c8ff,#ff4fd8);-webkit-background-clip:text;color:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 14px 90px}.card{background:#15182a;border:1px solid #30445a;border-radius:18px;overflow:hidden}.photo{height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#123b43,#252044,#41203b);font-size:55px}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.tag{display:inline-block;background:#123e32;color:#71f4b0;border-radius:20px;padding:5px 8px;font-size:11px}.muted{color:#939ab5;font-size:12px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;color:#fff;cursor:pointer}.primary{background:linear-gradient(90deg,#24d66b,#24b9ff,#a64dff)}.nav{background:#20283b}.danger{background:#45202b;color:#ff9baa}.plus{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;font-size:28px;background:linear-gradient(135deg,#27d86f,#25bfff,#a44dff,#ff4fbd);z-index:8}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#15182a;border:1px solid #46506b;border-radius:20px;padding:18px}.close{float:right;background:#292e48}input,textarea{width:100%;padding:12px;background:#0c0e18;border:1px solid #343a58;border-radius:10px;color:#fff;margin:5px 0 10px}textarea{min-height:80px}.messages{max-height:45vh;overflow:auto}.bubble{padding:9px 11px;background:#20263a;border-radius:12px;margin:7px 0}.bubble.mine{background:#173d32}.row{display:flex;gap:8px;flex-wrap:wrap}.adminBox{background:linear-gradient(145deg,#271315,#17100d);border-color:#8d6122}.gold{color:#ffd66b}.search{margin:16px;width:calc(100% - 32px);padding:13px;background:#111426;border:1px solid #303550;color:#fff;border-radius:12px}
@media(max-width:600px){.photo{height:145px}.grid{gap:9px}.body{padding:9px}button{padding:8px;font-size:11px}}
</style></head><body><header><div class="logo">🧠 <span>Brainrot Trade</span></div><button id="admin">🛡️ Admin</button></header><input class="search" id="search" placeholder="🔎 Rechercher un Brainrot..."><main id="list"></main><button class="plus" id="plus">＋</button><div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
const socket=io();let ads=[],adminToken='';let me=localStorage.getItem('bt_name')||'Joueur';
const $=id=>document.getElementById(id);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function modal(x,admin=false){$('box').className='box'+(admin?' adminBox':'');$('box').innerHTML=x;$('modal').classList.add('open')}function close(){ $('modal').classList.remove('open') }
async function load(){ads=await fetch('/api/ads').then(r=>r.json());render()}function render(){let q=$('search').value.toLowerCase();let a=ads.filter(x=>(x.name+' '+x.description+' '+x.looking).toLowerCase().includes(q));if(!a.length){$('list').innerHTML='<div style="padding:60px;text-align:center" class="muted">🧠 Aucune annonce pour le moment.<br><br>Sois le premier à publier !</div>';return}$('list').innerHTML='<div class="grid">'+a.map(x=>`<article class="card"><div class="photo">${x.photo?`<img src="${x.photo}">`:'🧠'}</div><div class="body"><span class="tag">🔄 ${esc(x.looking)}</span><h3>${esc(x.name)}</h3><div class="muted">👤 ${esc(x.owner)} ${x.certified?' 🛡️ Certifié':''}</div><div class="muted">⭐ ${x.rating?.count?x.rating.avg+' / 5 · '+x.rating.count+' évaluations':'Pas encore noté'}</div><p>${esc(x.description)}</p><div class="row"><button class="primary" onclick="startChat(${x.id})">💬 Chat</button><button class="danger" onclick="report(${x.id})">🚨</button></div></div></article>`).join('')+'</div>'}
async function startChat(id){let c=await fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adId:id,visitor:me})}).then(r=>r.json());openChat(c.id)}
async function openChat(id){let d=await fetch('/api/chats/'+id).then(r=>r.json());modal(`<button class="close" onclick="close()">✕</button><h2>💬 Chat</h2><div class="muted">${d.chat.closed?'🔒 Chat clôturé':'Conversation active'}</div><div class="messages" id="msgs">${d.messages.map(m=>bubble(m)).join('')}</div>${d.chat.closed?'':`<textarea id="msg" placeholder="Écris ton message..."></textarea><input id="fort" placeholder="Pseudo Fortnite (facultatif)"><div class="row"><button class="primary" onclick="send(${id})">Envoyer</button><button class="danger" onclick="closeChat(${id})">🔒 Clore le chat</button></div>`}${d.chat.closed&&!d.rating?`<hr><h3>⭐ Note le trade</h3><div class="row">${[1,2,3,4,5].map(n=>`<button class="primary" onclick="rate(${id},${n})">⭐ ${n}</button>`).join('')}</div>`:''}`);socket.emit('chat:join',id)}
function bubble(m){return `<div class="bubble ${m.sender===me?'mine':''}"><b>${esc(m.sender)}</b><br>${esc(m.text)}${m.fortnite?`<br><span class="tag">Fortnite : ${esc(m.fortnite)}</span>`:''}</div>`}
async function send(id){let t=$('msg').value.trim();if(!t)return;socket.emit('chat:send',{chatId:id,sender:me,text:t,fortnite:$('fort').value});$('msg').value='';$('fort').value=''}socket.on('chat:message',m=>{let box=$('msgs');if(box){box.insertAdjacentHTML('beforeend',bubble(m));box.scrollTop=box.scrollHeight}});socket.on('chat:closed',()=>{if($('msgs'))openChat(currentChat)});let currentChat=0;
async function closeChat(id){currentChat=id;await fetch('/api/chats/'+id+'/close',{method:'POST'});openChat(id)}async function rate(id,n){await fetch('/api/chats/'+id+'/rate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stars:n,rater:me})});alert('⭐ Merci pour ta note !');close()}
function report(id){modal(`<button class="close" onclick="close()">✕</button><h2>🚨 Signaler</h2><textarea id="reason" placeholder="Explique le problème..."></textarea><button class="danger" onclick="sendReport(${id})">Envoyer le signalement</button>`)}async function sendReport(id){let reason=$('reason').value.trim();if(!reason)return alert('Explique le problème.');await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adId:id,reporter:me,reason})});close();alert('🚨 Signalement envoyé.')}
$('plus').onclick=()=>modal(`<button class="close" onclick="close()">✕</button><h2>➕ Nouvelle annonce</h2><input id="name" placeholder="Nom du Brainrot"><input id="looking" placeholder="Ce que tu recherches"><textarea id="desc" placeholder="Description"></textarea><label>📸 Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><button class="primary" onclick="publish()">🚀 Publier</button>`);
async function publish(){let fd=new FormData();fd.append('name',$('name').value);fd.append('looking',$('looking').value);fd.append('description',$('desc').value);fd.append('owner',me);if($('photo').files[0])fd.append('photo',$('photo').files[0]);let r=await fetch('/api/ads',{method:'POST',body:fd});if(!r.ok)return alert('Erreur');close();load()}
$('admin').onclick=()=>modal(`<h2>🛡️ Administration</h2><p class="gold">VERSION ADMIN</p><input id="code" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres"><button class="primary" onclick="loginAdmin()">Entrer</button>` ,true);
async function loginAdmin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});if(!r.ok)return alert('❌ Code incorrect');adminToken=(await r.json()).token;adminPanel()}
async function adminPanel(){let reports=await fetch('/api/admin/reports',{headers:{Authorization:'Bearer '+adminToken}}).then(r=>r.json());modal(`<button class="close" onclick="close()">✕</button><h2>🧠 BRAINROT TRADE <span class="gold">VERSION ADMIN 👑</span></h2><p>🚨 Signalements : ${reports.length}</p>${reports.map(r=>`<div class="bubble"><b>${esc(r.name)}</b><br>${esc(r.reason)}<br><button class="danger" onclick="deleteAd(${r.ad_id})">🗑️ Supprimer l'annonce</button><button class="primary" onclick="certify(${r.ad_id},true)">☑️ Certifier</button></div>`).join('')}<hr><button class="danger" onclick="adminToken='';close()">🚪 Déconnexion</button>`,true)}
async function deleteAd(id){await fetch('/api/admin/ads/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+adminToken}});await load();adminPanel()}async function certify(id,v){await fetch('/api/admin/ads/'+id+'/certify',{method:'POST',headers:{Authorization:'Bearer '+adminToken,'Content-Type':'application/json'},body:JSON.stringify({certified:v})});await load();adminPanel()}
$('search').oninput=render;$('modal').onclick=e=>{if(e.target===$('modal'))close()};socket.on('ads:update',load);load();
</script></body></html>
